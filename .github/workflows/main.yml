name: DevSecOps Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  security-scanning:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    # TASK 1: SCA (Software Composition Analysis)
    - name: Install Safety
      run: pip install safety

    - name: Run SCA Scan
      run: safety check -r requirements.txt --full-report

    # TASK 2: SAST (Static Analysis)
    - name: Install Bandit
      run: pip install bandit

    - name: Run SAST Scan
      run: bandit -r . -ll -f json -o bandit-report.json

    # TASK 3: Upload the report so you can view it
    - name: Upload Bandit Report
      uses: actions/upload-artifact@v4
      with:
        name: bandit-findings
        path: bandit-report.json
